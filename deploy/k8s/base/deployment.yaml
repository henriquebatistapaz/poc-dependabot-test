apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-dependabot-test
  labels:
    app.kubernetes.io/name: poc-dependabot-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: poc-dependabot-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: poc-dependabot-test
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: poc-dependabot-test # replaced by kustomize image override
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: http }
          livenessProbe:
            httpGet: { path: /health, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
