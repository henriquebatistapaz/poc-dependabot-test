name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch (e.g. Dependabot pushing again).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Deliberately old major version so Dependabot (github-actions) has an update to propose.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --errors verify
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: dependabot-test-mini-jar
          path: target/*.jar
          if-no-files-found: error
