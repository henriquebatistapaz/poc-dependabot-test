name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Deliberately old major version so Dependabot (github-actions) has an update to propose.
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --errors verify
