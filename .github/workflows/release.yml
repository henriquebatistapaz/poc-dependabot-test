name: Release

# Publishes a GitHub Release with the built jar when a version tag is pushed,
# e.g. `git tag v0.1.0 && git push origin v0.1.0`.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Verify tag matches pom version
        run: |
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          if [ "$POM_VERSION" != "${TAG_VERSION%-SNAPSHOT}" ] && [ "$POM_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom version $POM_VERSION"
            exit 1
          fi
      - run: mvn --batch-mode --errors verify
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
