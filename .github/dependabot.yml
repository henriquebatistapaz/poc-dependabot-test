version: 2
updates:
  # Maven: minor/patch updates grouped into one PR; majors stay separate so they get reviewed alone.
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: [dependencies, java]
    commit-message:
      prefix: "build(deps)"
      include: scope
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      test-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # GitHub Actions: all action bumps grouped weekly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "ci(deps)"
      include: scope
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
